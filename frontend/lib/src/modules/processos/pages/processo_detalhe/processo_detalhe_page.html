<section class="detalhe-processo" aria-label="Detalhe do processo">
  <div class="acoes-topo">
    <button type="button" class="botao-voltar" (click)="solicitarRetorno()">Voltar para a lista</button>
  </div>

  <p class="carregando" *ngIf="carregandoCabecalho">Carregando dados do processo...</p>

  <section class="erro" *ngIf="mensagemErro.isNotEmpty" role="alert">
    <h3>Não foi possível carregar o processo</h3>
    <p>{{ mensagemErro }}</p>
  </section>

  <sei-processo-cabecalho *ngIf="cabecalho != null" [cabecalho]="cabecalho"></sei-processo-cabecalho>

  <ng-container *ngIf="cabecalho != null">
    <sei-processo-unidades-abertas [idProcesso]="idProcesso"></sei-processo-unidades-abertas>
    <sei-processo-documentos [idProcesso]="idProcesso"></sei-processo-documentos>
    <sei-processo-andamentos [idProcesso]="idProcesso"></sei-processo-andamentos>
    <sei-processo-relacionados [idProcesso]="idProcesso"></sei-processo-relacionados>
    <sei-processo-participantes [idProcesso]="idProcesso"></sei-processo-participantes>
    <sei-processo-marcadores [idProcesso]="idProcesso"></sei-processo-marcadores>
    <sei-processo-acompanhamentos [idProcesso]="idProcesso"></sei-processo-acompanhamentos>
    <sei-processo-controles-prazo [idProcesso]="idProcesso" [idUnidade]="idUnidade"></sei-processo-controles-prazo>
    <sei-processo-anotacoes [idProcesso]="idProcesso" [idUnidade]="idUnidade"></sei-processo-anotacoes>
    <sei-processo-retornos-programados [idProcesso]="idProcesso"></sei-processo-retornos-programados>
  </ng-container>
</section>
