<div class="aplicacao">
  <header class="cabecalho">
    <div>
      <p class="marca">Sistema Eletrônico de Informações</p>
      <h1>Catálogos de referência</h1>
    </div>
    <button type="button" class="botao-secundario" (click)="atualizarAbaAtual()" [disabled]="carregando || carregandoAtividades || carregandoProcessosGerados || carregandoContexto">
      {{ carregando || carregandoAtividades || carregandoProcessosGerados || carregandoContexto ? 'Atualizando...' : 'Atualizar' }}
    </button>
  </header>

  <main>
    <p class="carregando" *ngIf="carregando">Carregando dados restaurados do SEI...</p>

    <section class="erro" *ngIf="erro != null" role="alert">
      <h2>Não foi possível carregar a tela</h2>
      <p>{{ erro }}</p>
      <button type="button" class="botao-erro" (click)="recarregar()">Tentar novamente</button>
    </section>

    <section *ngIf="!carregando && erro == null">
      <sei-catalogo-resumo [resumo]="resumo" [status]="status"></sei-catalogo-resumo>

      <sei-contexto-desenvolvimento
        [contexto]="contextoDesenvolvimento"
        [idUnidadeSelecionada]="idUnidadeSelecionada"
        [carregando]="carregandoContexto"
        [erro]="erroContexto"
        (unidadeSelecionada)="selecionarUnidade($event)">
      </sei-contexto-desenvolvimento>

      <nav class="abas" aria-label="Consultas disponíveis">
      <button
        type="button"
        [class.ativa]="abaTiposSelecionada"
        [attr.aria-pressed]="abaTiposSelecionada ? 'true' : 'false'"
        (click)="selecionarTipos()">
        Tipos de processo
      </button>
      <button
        type="button"
        [class.ativa]="abaSeriesSelecionada"
        [attr.aria-pressed]="abaSeriesSelecionada ? 'true' : 'false'"
        (click)="selecionarSeries()">
        Tipos de documento
      </button>
      <button
        type="button"
        [class.ativa]="abaAtividadesSelecionada"
        [attr.aria-pressed]="abaAtividadesSelecionada ? 'true' : 'false'"
        (click)="selecionarAtividades()">
        Processos recebidos
      </button>
      <button
        type="button"
        [class.ativa]="abaProcessosGeradosSelecionada"
        [attr.aria-pressed]="abaProcessosGeradosSelecionada ? 'true' : 'false'"
        (click)="selecionarProcessosGerados()">
        Processos gerados
      </button>
      </nav>

      <section class="consulta" *ngIf="abaTiposSelecionada">
      <label for="filtro-tipos">Filtrar tipos de processo</label>
      <input id="filtro-tipos" type="search" placeholder="Nome ou código" (input)="filtrarTipos($event)">
      <sei-lista-tipos-procedimento [itens]="tiposProcedimentoVisiveis"></sei-lista-tipos-procedimento>
      </section>

      <section class="consulta" *ngIf="abaSeriesSelecionada">
      <label for="filtro-series">Filtrar tipos de documento</label>
      <input id="filtro-series" type="search" placeholder="Nome ou código" (input)="filtrarSeries($event)">
      <sei-lista-series [itens]="seriesVisiveis"></sei-lista-series>
      </section>

      <section class="consulta" *ngIf="abaAtividadesSelecionada">
      <sei-atividades-em-aberto
        [titulo]="tituloAtividades"
        [descricaoConsulta]="descricaoAtividades"
        [tituloVazio]="tituloAtividadesVazio"
        [descricaoVazia]="descricaoAtividadesVazia"
        [rotuloDataAbertura]="rotuloDataAtividades"
        [pagina]="paginaProcessosRecebidos"
        [carregando]="carregandoAtividades"
        [erro]="erroAtividades"
        [unidadeSelecionada]="unidadeSelecionadaRotulo"
        (paginaSolicitada)="solicitarPaginaAtividades($event)"
        (processoSelecionado)="abrirProcesso($event)">
      </sei-atividades-em-aberto>
      </section>

      <section class="consulta" *ngIf="abaProcessosGeradosSelecionada">
      <sei-atividades-em-aberto
        [titulo]="tituloProcessosGerados"
        [descricaoConsulta]="descricaoProcessosGerados"
        [tituloVazio]="tituloProcessosGeradosVazio"
        [descricaoVazia]="descricaoProcessosGeradosVazia"
        [rotuloDataAbertura]="rotuloDataProcessosGerados"
        [pagina]="paginaProcessosGerados"
        [carregando]="carregandoProcessosGerados"
        [erro]="erroProcessosGerados"
        [unidadeSelecionada]="unidadeSelecionadaRotulo"
        (paginaSolicitada)="solicitarPaginaProcessosGerados($event)"
        (processoSelecionado)="abrirProcesso($event)">
      </sei-atividades-em-aberto>
      </section>
    </section>
  </main>
</div>
